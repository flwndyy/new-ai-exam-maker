name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/deploy-frontend.yml"
      - "infra/deploy/deploy-frontend-on-ec2.sh"
      - "infra/iam/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  FRONTEND_BUCKET_NAME: ${{ vars.FRONTEND_BUCKET_NAME }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
  NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
  NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
  # Optional: school name printed on exam sheets (B10); unset omits the line.
  NEXT_PUBLIC_SCHOOL_NAME: ${{ vars.NEXT_PUBLIC_SCHOOL_NAME }}

jobs:
  deploy:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate public build configuration
        run: |
          [[ "$NEXT_PUBLIC_COGNITO_DOMAIN" == https://* ]] || {
            echo "NEXT_PUBLIC_COGNITO_DOMAIN must start with https://"
            exit 1
          }
          test -n "$NEXT_PUBLIC_COGNITO_CLIENT_ID"
          [[ "$FRONTEND_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo "FRONTEND_BUCKET_NAME is not a valid S3 bucket name"
            exit 1
          }
          test -n "$EC2_INSTANCE_ID"
          [[ "$FRONTEND_PUBLIC_URL" =~ ^https://[A-Za-z0-9.-]+(/[^[:space:]]*)?$ ]] || {
            echo "FRONTEND_PUBLIC_URL must be a simple HTTPS URL"
            exit 1
          }
          test -n "$AWS_ROLE_ARN"

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build

      - name: Save build artifact for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-out-${{ github.sha }}
          path: frontend/out
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: frontend-deploy-${{ github.run_id }}

      - name: Package frontend release
        id: package
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$RUNNER_TEMP/frontend.tar.gz"
          checksum="$archive.sha256"
          tar -C out -czf "$archive" .
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$checksum")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload release to S3
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          prefix="frontend/releases/$RELEASE_ID"
          aws s3 cp "$ARCHIVE" "s3://$FRONTEND_BUCKET_NAME/$prefix/frontend.tar.gz"
          aws s3 cp "$CHECKSUM" "s3://$FRONTEND_BUCKET_NAME/$prefix/frontend.tar.gz.sha256"
          aws s3 cp ../infra/deploy/deploy-frontend-on-ec2.sh "s3://$FRONTEND_BUCKET_NAME/$prefix/deploy-frontend-on-ec2.sh"

      - name: Deploy release through SSM
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          prefix="frontend/releases/$RELEASE_ID"
          script_key="$prefix/deploy-frontend-on-ec2.sh"
          command_json=$(jq -n \
            --arg bucket "$FRONTEND_BUCKET_NAME" \
            --arg script_key "$script_key" \
            --arg release_id "$RELEASE_ID" \
            --arg region "$AWS_REGION" \
            --arg public_url "$FRONTEND_PUBLIC_URL" \
            '{commands: [
              ("aws s3 cp --region " + ($region|@sh) + " s3://" + ($bucket|@sh) + "/" + ($script_key|@sh) + " /tmp/deploy-frontend-" + ($release_id|@sh) + ".sh"),
              ("sudo bash /tmp/deploy-frontend-" + ($release_id|@sh) + ".sh --region " + ($region|@sh) + " --bucket " + ($bucket|@sh) + " --artifact-key " + (("frontend/releases/" + $release_id + "/frontend.tar.gz")|@sh) + " --checksum-key " + (("frontend/releases/" + $release_id + "/frontend.tar.gz.sha256")|@sh) + " --release-id " + ($release_id|@sh) + " --public-url " + ($public_url|@sh))
            ]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$command_json" \
            --comment "Deploy frontend $RELEASE_ID" \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" || true
                exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM command did not finish within 5 minutes: $command_id" >&2
          exit 1
