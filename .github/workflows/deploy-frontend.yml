name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  FRONTEND_BUCKET_NAME: ${{ vars.FRONTEND_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
  NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}

jobs:
  deploy:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate public build configuration
        run: |
          [[ "$NEXT_PUBLIC_COGNITO_DOMAIN" == https://* ]] || {
            echo "NEXT_PUBLIC_COGNITO_DOMAIN must start with https://"
            exit 1
          }
          test -n "$NEXT_PUBLIC_COGNITO_CLIENT_ID"
          test -n "$FRONTEND_BUCKET_NAME"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$AWS_ROLE_ARN"

      - name: Build static frontend
        run: npm run build

      - name: Save build artifact for rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-out-${{ github.sha }}
          path: frontend/out
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: frontend-deploy-${{ github.run_id }}

      - name: Upload fingerprinted assets
        run: |
          aws s3 cp out/ "s3://$FRONTEND_BUCKET_NAME/" --recursive \
            --exclude "*" \
            --include "_next/static/*" \
            --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML and non-fingerprinted assets
        run: |
          aws s3 sync out/ "s3://$FRONTEND_BUCKET_NAME/" --delete \
            --exclude "_next/static/*" \
            --exclude "assets/*" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
