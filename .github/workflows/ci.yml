name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same version as .pre-commit-config.yaml. Binary is pinned by version + sha256.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact --verbose

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore ExamMaker.slnx
      - name: Format check
        run: dotnet format ExamMaker.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ExamMaker.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ExamMaker.slnx -c Release --no-build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # frontend/ has no package.json yet; skip instead of failing until it exists.
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet - skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck --if-present
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build --if-present

  # Single required status check for `main`: it stays stable while jobs above change.
  ci:
    name: CI
    if: always()
    needs: [gitleaks, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          echo "gitleaks=${{ needs.gitleaks.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          test "${{ needs.gitleaks.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
