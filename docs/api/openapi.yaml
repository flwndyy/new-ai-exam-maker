openapi: 3.1.0

info:
  title: AI Exam Maker API
  version: 0.1.0
  summary: Hợp đồng API v1 — frontend và backend cùng bám file này.
  description: |
    Nguồn nghiệp vụ: `docs/context.md` (mục 3 phân quyền, mục 4 state machine, mục 8 dữ liệu, mục 9 API).
    Mâu thuẫn giữa file này và `context.md` → sửa `context.md` trước, rồi cập nhật file này trong cùng PR.

    ## Quy ước chung
    - Base path `/api/v1`, cùng domain với frontend (không cần CORS).
    - Xác thực: `Authorization: Bearer <Cognito access token>`. Quyền thật được kiểm ở backend theo **user trong DB**
      (role, tổ, `is_active`, ownership), không chỉ theo claim token (context 3.1, 3.3).
    - ID là GUID; thời gian là UTC ISO-8601 (`2026-11-18T09:30:00Z`); frontend tự đổi sang múi giờ Việt Nam.
    - Tên trường JSON dùng `camelCase`; giá trị enum dùng `PascalCase`, riêng `Role` dùng chữ thường (trùng nhóm Cognito).
    - Thao tác chuyển trạng thái là `POST /{resource}/{id}/{action}` (không có `PUT status`); trả về tài nguyên sau khi đổi.
      Mọi chuyển trạng thái đều ghi `audit_logs` và đi qua state machine ở backend.
    - Điểm (`points`, `totalPoints`) là số thập phân; backend lưu `numeric`, không dùng float để cộng dồn.

    ## Lỗi (`application/problem+json`, RFC 9457)
    Mọi phản hồi lỗi (4xx/5xx) đều là `Problem`. Frontend phân nhánh theo `code` (ổn định), không theo `title`/`detail`
    (có thể đổi lời). Lỗi validate (400) có thêm `errors` theo tên trường.

    | HTTP | Khi nào |
    |---|---|
    | 400 | Body/query sai định dạng hoặc không qua validate (`ValidationFailed`) |
    | 401 | Thiếu/sai/hết hạn token; hoặc `sub` chưa có trong `users`; hoặc user bị vô hiệu hóa |
    | 403 | Đúng người dùng nhưng sai vai trò / tổ / ownership, hoặc tự duyệt nội dung của mình |
    | 404 | Không tồn tại **hoặc** người gọi không được phép biết là tồn tại |
    | 409 | Sai trạng thái (state machine), xung đột ràng buộc (vd đã có bản `Published`) |
    | 429 | Rate limit hoặc hết quota AI (kèm `Retry-After`) |
    | 5xx | Lỗi hệ thống; `traceId` dùng để tra log |

    ## Phân trang
    Danh sách dùng `page` (từ 1, mặc định 1) và `pageSize` (mặc định 20, tối đa 100). Phản hồi là
    `{ items, page, pageSize, totalItems, totalPages }`. Sắp xếp mặc định cố định theo từng endpoint (ghi ở mô tả);
    chưa hỗ trợ tham số `sort` trong MVP.

    ## Đã tự đặt khi soạn (cần DEV-A review)
    Những điểm context.md chưa nói rõ, được đánh dấu `[GIẢ ĐỊNH]` trong mô tả để dễ tìm.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: Cùng origin với frontend (CloudFront `/api/*` → EC2)

security:
  - bearerAuth: []

tags:
  - name: Me
  - name: Catalog
    description: Danh mục môn/chương/tổ — mọi vai trò đã đăng nhập, chỉ đọc.
  - name: Questions
  - name: Review
    description: Hàng đợi duyệt của Head/Admin.
  - name: QuestionSets
  - name: AI
  - name: Exams
  - name: ExamVersions
  - name: Publishing
  - name: Export
  - name: Audit
  - name: Admin

paths:
  # ───────────────────────────── Me ─────────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Thông tin người dùng hiện tại
      description: Đọc từ DB theo `sub` của token. Frontend dùng `role`/`departmentId` chỉ để ẩn/hiện UI.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Catalog ─────────────────────────────
  /departments:
    get:
      tags: [Catalog]
      operationId: listDepartments
      summary: Danh sách tổ chuyên môn
      description: Sắp xếp theo `name`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subjects:
    get:
      tags: [Catalog]
      operationId: listSubjects
      summary: Danh sách môn học
      description: Sắp xếp theo `name`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /topics:
    get:
      tags: [Catalog]
      operationId: listTopics
      summary: Danh sách chương
      description: Sắp xếp theo `grade`, rồi `sortOrder`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Questions ─────────────────────────────
  /questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: Danh sách câu hỏi
      description: |
        Phạm vi nhìn thấy (context 3.2): câu `Draft`/`Rejected`/`Submitted` của chính mình; câu `Approved` cùng tổ;
        Admin xem tất cả. Sắp xếp `createdAt` giảm dần.
        Dùng `mine=true` cho "Ngân hàng của tôi".
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QuestionStatus' }
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: topicId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/QuestionType' }
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: mine
          in: query
          description: Chỉ câu do chính người gọi tạo.
          schema: { type: boolean, default: false }
        - name: aiJobId
          in: query
          description: '[GIẢ ĐỊNH] Lọc câu do một job AI sinh ra — để rà soát kết quả job.'
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: Tạo câu hỏi thủ công
      description: |
        Tạo câu `source=Manual`, trạng thái `Draft`, `revision=1`; `departmentId` lấy từ môn học và cố định từ lúc tạo.
        Câu do AI sinh được tạo bởi worker, không qua endpoint này. Admin không tạo nội dung (403).
        `payload` phải khớp `type` (context 8.2), sai → 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '201':
          description: Đã tạo
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /questions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Questions]
      operationId: getQuestion
      summary: Chi tiết câu hỏi
      description: Tác giả xem câu của mình; câu Approved dùng chung trong tổ; Head được xem Submitted cùng tổ để duyệt; Admin xem tất cả. Ngoài phạm vi hoặc không tồn tại trả 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Questions]
      operationId: updateQuestion
      summary: Sửa câu hỏi
      description: |
        Chỉ người tạo; chỉ khi `Draft`, `Rejected` hoặc `Approved`.
        - `Draft`/`Rejected`: sửa tại chỗ (giữ trạng thái).
        - `Approved`: sửa nội dung → quay về `Draft` và `revision + 1`; đề đã snapshot không bị ảnh hưởng.
        - `Submitted`: 409 (`InvalidStateTransition`) — phải `withdraw` trước.
        Sửa nội dung câu AI làm `aiReviewedByAuthor` về `false` và `aiVerification` về `NotChecked`. [GIẢ ĐỊNH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Questions]
      operationId: deleteQuestion
      summary: Xóa câu hỏi
      description: |
        Chỉ người tạo, chỉ câu `Draft`/`Rejected` và **chưa được đề nào tham chiếu**
        (`409 QuestionReferenced`). Câu đã `Approved` dùng `archive`.
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/submit:
    post:
      tags: [Questions]
      operationId: submitQuestion
      summary: Gửi duyệt câu hỏi
      description: |
        `Draft`/`Rejected` → `Submitted`; chỉ người tạo.
        Câu `source=AI` bắt buộc đã `mark-reviewed`, nếu chưa → 409 `AiReviewRequired`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/withdraw:
    post:
      tags: [Questions]
      operationId: withdrawQuestion
      summary: Rút lại câu hỏi đã gửi duyệt
      description: '`Submitted` → `Draft`; chỉ người tạo, trước khi có quyết định.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/approve:
    post:
      tags: [Questions]
      operationId: approveQuestion
      summary: Duyệt câu hỏi
      description: |
        `Submitted` → `Approved`. Head: cùng tổ và không phải câu của mình. Admin: không phải câu của mình.
        Duyệt câu của chính mình → 403 `SelfReview`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/reject:
    post:
      tags: [Questions]
      operationId: rejectQuestion
      summary: Từ chối câu hỏi
      description: '`Submitted` → `Rejected`; `note` (lý do) bắt buộc. Cùng quy tắc ai được duyệt với `approve`.'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/archive:
    post:
      tags: [Questions]
      operationId: archiveQuestion
      summary: Lưu trữ câu hỏi
      description: |
        `Approved` → `Archived` (không khôi phục trong MVP). Teacher: câu của mình; Head: cùng tổ; Admin: tất cả.
        Các đề đã snapshot không bị ảnh hưởng.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /questions/{id}/mark-reviewed:
    post:
      tags: [Questions]
      operationId: markQuestionReviewed
      summary: Đánh dấu "Đã rà soát" câu do AI sinh
      description: |
        Đặt `aiReviewedByAuthor=true`. Chỉ người tạo, chỉ câu `source=AI` đang `Draft`/`Rejected`.
        Điều kiện bắt buộc trước khi `submit` (context 4.1.2).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/QuestionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Review queue ─────────────────────────────
  /review/questions:
    get:
      tags: [Review]
      operationId: listReviewQuestions
      summary: Hàng đợi duyệt câu hỏi
      description: |
        Câu `Submitted` trong tổ của Head (tất cả với Admin), **loại trừ câu do chính người xem tạo**.
        Teacher gọi → 403. Sắp xếp `submittedAt` tăng dần (gửi trước, duyệt trước).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: topicId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /review/exam-versions:
    get:
      tags: [Review]
      operationId: listReviewExamVersions
      summary: Hàng đợi duyệt phiên bản đề
      description: Cùng quy tắc với `/review/questions`, áp cho phiên bản đề `Submitted`. Sắp xếp `submittedAt` tăng dần.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamVersionSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── Question sets ─────────────────────────────
  /question-sets:
    get:
      tags: [QuestionSets]
      operationId: listQuestionSets
      summary: Danh sách bộ câu hỏi của tôi
      description: Chỉ bộ do người gọi tạo. Sắp xếp `updatedAt` giảm dần.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [QuestionSets]
      operationId: createQuestionSet
      summary: Tạo bộ câu hỏi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSetInput' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /question-sets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [QuestionSets]
      operationId: getQuestionSet
      summary: Chi tiết bộ câu hỏi (kèm các câu)
      description: |
        Câu hỏi trong bộ chỉ hiện nếu người gọi vẫn được xem câu đó theo quyền hiện tại
        (vd câu `Approved` của tổ khác sẽ bị ẩn khỏi `items`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [QuestionSets]
      operationId: updateQuestionSet
      summary: Đổi tên bộ câu hỏi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSetInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [QuestionSets]
      operationId: deleteQuestionSet
      summary: Xóa bộ câu hỏi
      description: Chỉ xóa bộ và liên kết, **không** xóa câu hỏi.
      responses:
        '204': { description: Đã xóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /question-sets/{id}/items:
    post:
      tags: [QuestionSets]
      operationId: addQuestionSetItem
      summary: Thêm câu hỏi vào bộ
      description: |
        Câu phải là câu của mình hoặc `Approved` cùng tổ. Thêm câu đã có trong bộ → 409 `Conflict` (không lỗi âm thầm).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSetItemInput' }
      responses:
        '200':
          description: Bộ sau khi thêm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSetDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /question-sets/{id}/items/{questionId}:
    delete:
      tags: [QuestionSets]
      operationId: removeQuestionSetItem
      summary: Bỏ câu hỏi khỏi bộ
      description: >-
        [GIẢ ĐỊNH] context 9.1 ghi `DELETE /question-sets/{id}/items`; ở đây đặt `questionId` vào path
        vì DELETE kèm body không đáng tin qua proxy/CloudFront. Cập nhật context.md cùng PR.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: questionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Đã bỏ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── AI ─────────────────────────────
  /ai/generate:
    post:
      tags: [AI]
      operationId: generateQuestions
      summary: Yêu cầu AI sinh câu hỏi (bất đồng bộ)
      description: |
        Kiểm rate limit + quota **trước** khi tạo job; tạo `ai_generation_jobs(Queued)` rồi gửi SQS.
        Trả `202` ngay; frontend polling `GET /ai/jobs/{id}`. Chỉ Teacher/Head (Admin → 403).
        Vượt quota/rate limit → 429 với `code` = `QuotaExceeded` hoặc `RateLimited`.
        `note` được coi là dữ liệu không tin cậy (context 4.1.1), giới hạn độ dài.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiGenerateRequest' }
      responses:
        '202':
          description: Đã nhận, job ở trạng thái `Queued`
          headers:
            Location:
              description: URL của job
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ai/jobs:
    get:
      tags: [AI]
      operationId: listAiJobs
      summary: Danh sách job AI của tôi
      description: "Teacher/Head: job do mình yêu cầu. Admin: tất cả. Sắp xếp `createdAt` giảm dần."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AiJobStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ai/jobs/{id}:
    get:
      tags: [AI]
      operationId: getAiJob
      summary: Trạng thái một job AI
      description: |
        Dùng để polling (backoff phía client). Khi `Succeeded`, `questionIds` liệt kê các câu `Draft` đã sinh;
        khi `Failed`, `errorCode`/`errorMessage` giải thích lý do. Có thể rời trang và quay lại xem.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ai/quota:
    get:
      tags: [AI]
      operationId: getAiQuota
      summary: Quota AI còn lại của tôi hôm nay
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Exams ─────────────────────────────
  /exams:
    get:
      tags: [Exams]
      operationId: listExams
      summary: Danh sách đề
      description: |
        Đề của mình, đề trong tổ (Head), đề có phiên bản `Published` cùng tổ (xem thêm 3.2); Admin tất cả.
        Sắp xếp `updatedAt` giảm dần.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: mine
          in: query
          schema: { type: boolean, default: false }
        - name: hasPublished
          in: query
          description: '[GIẢ ĐỊNH] Chỉ đề đang có một phiên bản `Published`.'
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Exams]
      operationId: createExam
      summary: Tạo đề mới
      description: |
        [GIẢ ĐỊNH] Tạo `Exam` **kèm phiên bản 1 ở trạng thái `Draft`** (rỗng, `durationMinutes` mặc định 45);
        frontend không phải gọi thêm bước tạo phiên bản đầu. `departmentId` lấy từ môn học.
        Admin không tạo nội dung (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamCreate' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /exams/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exams]
      operationId: getExam
      summary: Chi tiết đề (metadata + tóm tắt các phiên bản)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Exams]
      operationId: updateExam
      summary: Sửa metadata của đề
      description: |
        [GIẢ ĐỊNH] Chỉ đổi `title`. Môn/khối cố định sau khi tạo vì ràng buộc ghép câu (context 8.3) phụ thuộc chúng.
        Chỉ người tạo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exams/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [ExamVersions]
      operationId: listExamVersions
      summary: Các phiên bản của một đề
      description: Sắp xếp `versionNo` giảm dần. Không kèm danh sách câu (dùng `GET /exam-versions/{vid}`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamVersionSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ExamVersions]
      operationId: createExamVersion
      summary: Tạo phiên bản mới từ phiên bản cũ
      description: |
        Sao chép từ `fromVersionId` (mặc định: phiên bản mới nhất) thành phiên bản `Draft` với `versionNo` kế tiếp.
        Chỉ người tạo đề. Nếu đề đang có phiên bản `Draft` chưa gửi → 409 `Conflict` [GIẢ ĐỊNH, tránh nhiều bản nháp song song].
        Nội dung sao chép là nội dung **hiện tại** của câu nguồn (không phải snapshot cũ); câu nguồn đã `Archived` bị loại và báo trong `warnings`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamVersionCreate' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamVersion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [ExamVersions]
      operationId: getExamVersion
      summary: Chi tiết phiên bản đề (kèm câu hỏi)
      description: |
        - `Draft`/`Rejected`: `items` là nội dung **hiện tại** của câu nguồn;
          `currentSourceRevision` khác `sourceRevision` → frontend cảnh báo "câu nguồn đã đổi".
        - Từ `Submitted` trở đi: `items` là **snapshot** bất biến (`currentSourceRevision = null`).
        Response này chứa đáp án; chỉ trả cho người được phép xem đáp án (3.2). Người chỉ được xem đề học sinh
        (vd Teacher xem đề `Published` của tổ) dùng `student-sheet`, gọi endpoint này → 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ExamVersions]
      operationId: updateExamVersion
      summary: Chọn/sắp xếp câu, đặt điểm, thời gian
      description: |
        Chỉ khi `Draft`/`Rejected`, chỉ người tạo; trạng thái khác → 409 `InvalidStateTransition`.
        Body **thay toàn bộ** danh sách câu; thứ tự mảng = `sortOrder` (bắt đầu từ 1). `Rejected` được mở khóa khi sửa [giữ trạng thái đến khi `submit`].
        Mỗi câu phải là câu của mình hoặc `Approved` cùng tổ, cùng môn/khối với đề (context 8.3) → sai thì 400 `ValidationFailed`.
        `totalPoints` do server tính (tổng `points`); không nhận từ client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamVersionUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamVersion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/submit:
    post:
      tags: [ExamVersions]
      operationId: submitExamVersion
      summary: Gửi duyệt phiên bản đề (chụp snapshot)
      description: |
        `Draft`/`Rejected` → `Submitted`. Mọi câu phải đang `Approved`, nếu không → 409 `QuestionsNotApproved`
        kèm `invalidQuestionIds`. Đề phải có ít nhất 1 câu và `points > 0`.
        Server sao chép nội dung/đáp án/lời giải/điểm vào snapshot và tính `contentHash`; mỗi lần submit lại chụp snapshot mới.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/withdraw:
    post:
      tags: [ExamVersions]
      operationId: withdrawExamVersion
      summary: Rút lại phiên bản đã gửi duyệt
      description: '`Submitted` → `Draft` (mở khóa); chỉ người tạo, trước khi có quyết định.'
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/approve:
    post:
      tags: [ExamVersions]
      operationId: approveExamVersion
      summary: Duyệt phiên bản đề
      description: '`Submitted` → `Approved`. Quy tắc ai duyệt như câu hỏi (cùng tổ, không phải của mình; Admin duyệt thay).'
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/reject:
    post:
      tags: [ExamVersions]
      operationId: rejectExamVersion
      summary: Từ chối phiên bản đề
      description: '`Submitted` → `Rejected`; `note` bắt buộc.'
      parameters:
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/archive:
    post:
      tags: [ExamVersions]
      operationId: archiveExamVersion
      summary: Lưu trữ phiên bản đề
      description: '`Approved`/`Rejected` → `Archived` (không khôi phục). Teacher: của mình; Head: cùng tổ; Admin: tất cả.'
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Publishing ─────────────────────────────
  /exam-versions/{vid}/publish:
    post:
      tags: [Publishing]
      operationId: publishExamVersion
      summary: Publish phiên bản đề (Admin)
      description: |
        `Approved` → `Published` (bất biến). Nếu đề đã có phiên bản `Published` khác → 409 `PublishedVersionExists`
        (phải `unpublish` bản cũ trước). Chỉ Admin.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/unpublish:
    post:
      tags: [Publishing]
      operationId: unpublishExamVersion
      summary: Thu hồi phiên bản đã publish (Admin)
      description: '`Published` → `Approved` (không có trạng thái `Unpublished`; lịch sử nằm ở `audit_logs`). Chỉ Admin.'
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ExamVersionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Export ─────────────────────────────
  /exam-versions/{vid}/student-sheet:
    get:
      tags: [Export]
      operationId: getStudentSheet
      summary: Dữ liệu đề học sinh (không đáp án)
      description: |
        Đọc từ **snapshot**; chỉ phiên bản từ `Submitted` trở đi (còn `Draft`/`Rejected` → 409, vì chưa có snapshot).
        Schema `StudentSheet` **không có** trường đáp án/lời giải — tách hẳn khỏi `AnswerKey` để đáp án không lọt vào đề học sinh.
        Quyền: đề của mình & đề `Published` cùng tổ (Teacher/Head), tất cả (Admin).
        Frontend dựng trang xem trước có CSS in + KaTeX và xuất PDF bằng trình duyệt; tên trường (header) do frontend cấu hình.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSheet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /exam-versions/{vid}/answer-key:
    get:
      tags: [Export]
      operationId: getAnswerKey
      summary: Dữ liệu đáp án/lời giải cho giáo viên
      description: |
        Đọc từ snapshot, quyền chặt hơn: đề của mình (Teacher), đề trong tổ (Head), tất cả (Admin).
        Người chỉ được xem đề học sinh → 403.
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Audit ─────────────────────────────
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Nhật ký audit
      description: "Head: giới hạn trong tổ của mình. Admin: tất cả. Teacher → 403. Sắp xếp `createdAt` giảm dần."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/AuditEntityType' }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          description: Từ thời điểm (UTC, gồm).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Đến thời điểm (UTC, không gồm).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── Admin ─────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: Danh sách người dùng
      description: Chỉ Admin. Sắp xếp `fullName`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Tìm theo email hoặc họ tên (chứa, không phân biệt hoa thường).
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Tạo người dùng
      description: |
        Gọi Cognito `AdminCreateUser` + `AdminAddUserToGroup` rồi ghi bảng `users`; lỗi giữa chừng thì đền bù bước đã làm (3.3).
        [GIẢ ĐỊNH] **API không nhận/trả mật khẩu**: Cognito sinh mật khẩu tạm và gửi email mời; người dùng đổi mật khẩu
        ở lần đăng nhập đầu qua Managed Login. Email đã tồn tại → 409 `Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/reconcile:
    post:
      tags: [Admin]
      operationId: adminReconcileUsers
      summary: Đối soát nhóm Cognito với `users.role`
      description: Chỉ đọc và báo lệch, **không tự sửa**. Chỉ Admin.
      responses:
        '200':
          description: Kết quả đối soát
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin]
      operationId: adminGetUser
      summary: Chi tiết người dùng
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Sửa người dùng
      description: |
        Đổi `role`/`departmentId`/`email` cập nhật DB **và** Cognito (group/thuộc tính); có hiệu lực ngay ở API.
        `isActive=false` → `AdminDisableUser` + `AdminUserGlobalSignOut`; `true` → `AdminEnableUser`.
        Admin không tự hạ vai trò/vô hiệu hóa chính mình (409 `Conflict`). [GIẢ ĐỊNH]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      operationId: adminDeactivateUser
      summary: Vô hiệu hóa người dùng
      description: |
        [GIẢ ĐỊNH] **Xóa mềm**: tương đương `PUT isActive=false` (không xóa hàng, vì còn tham chiếu từ câu hỏi/đề/audit).
        Idempotent.
      responses:
        '204': { description: Đã vô hiệu hóa }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

