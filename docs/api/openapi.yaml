  /admin/ai-usage:
    get:
      tags: [Admin]
      operationId: adminGetAiUsage
      summary: Thống kê sử dụng AI
      description: |
        Từ `ai_usage_daily`, một dòng cho mỗi (user, ngày). Sắp xếp `date` giảm dần.
        `estimatedCostUsd` là ước tính theo bảng giá cấu hình, **không phải hóa đơn AWS**.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsagePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token (Authorization Code + PKCE).

  parameters:
    Page:
      name: page
      in: query
      description: Trang, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Số phần tử mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: vid
      in: path
      required: true
      description: ID của phiên bản đề (`ExamVersion.id`).
      schema: { type: string, format: uuid }

  responses:
    QuestionOk:
      description: Câu hỏi sau khi chuyển trạng thái
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Question' }
    ExamVersionOk:
      description: Phiên bản đề sau khi chuyển trạng thái
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExamVersion' }
    ValidationError:
      description: 400 — dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/validation-failed
            title: Dữ liệu không hợp lệ
            status: 400
            code: ValidationFailed
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            errors:
              stem: ['Nội dung câu hỏi không được để trống']
              payload.correctLabel: ['Phải khớp một nhãn trong options']
    Unauthorized:
      description: 401 — chưa đăng nhập, token sai/hết hạn, user chưa có trong hệ thống hoặc bị vô hiệu hóa
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/unauthorized
            title: Chưa xác thực
            status: 401
            code: Unauthorized
    Forbidden:
      description: 403 — không đủ quyền (vai trò, tổ, ownership, tự duyệt nội dung của mình)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/self-review
            title: Không thể duyệt nội dung do chính mình tạo
            status: 403
            code: SelfReview
    NotFound:
      description: 404 — không tồn tại hoặc người gọi không được biết là tồn tại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/not-found
            title: Không tìm thấy
            status: 404
            code: NotFound
    Conflict:
      description: 409 — sai trạng thái hoặc vi phạm ràng buộc
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/questions-not-approved
            title: Có câu hỏi chưa được duyệt
            status: 409
            code: QuestionsNotApproved
            invalidQuestionIds: ['3fa85f64-5717-4562-b3fc-2c963f66afa6']
    TooManyRequests:
      description: 429 — rate limit hoặc hết quota AI
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://exammaker.example/problems/quota-exceeded
            title: Đã hết quota AI hôm nay
            status: 429
            code: QuotaExceeded

  schemas:
    # ───────────── Lỗi & phân trang ─────────────
    Problem:
      type: object
      description: RFC 9457 `application/problem+json`, có thêm các trường mở rộng của dự án.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI định danh loại lỗi (không cần truy cập được).
        title:
          type: string
          description: Tóm tắt ngắn, tiếng Việt, hiển thị được cho người dùng.
        status:
          type: integer
          description: Trùng mã HTTP.
        detail:
          type: string
          description: Giải thích cụ thể cho lần gặp này.
        instance:
          type: string
          description: Đường dẫn request gây lỗi.
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: string
          description: Dùng để tra log; không chứa dữ liệu nhạy cảm.
        errors:
          type: object
          description: Chỉ có khi `code=ValidationFailed`. Khóa là đường dẫn trường (`payload.options[2].text`).
          additionalProperties:
            type: array
            items: { type: string }
        invalidQuestionIds:
          type: array
          description: Chỉ có khi `code=QuestionsNotApproved`.
          items: { type: string, format: uuid }
      additionalProperties: true

    ErrorCode:
      type: string
      description: |
        Mã lỗi máy đọc được, ổn định. Có thể **thêm** mã mới; client phải xử lý mã lạ như lỗi chung theo HTTP status.
        - `ValidationFailed` (400) · `Unauthorized` (401) · `Forbidden` (403) · `NotFound` (404) · `Conflict` (409)
        - `SelfReview` (403): tự duyệt nội dung của mình
        - `InvalidStateTransition` (409): thao tác không hợp lệ ở trạng thái hiện tại
        - `AiReviewRequired` (409): câu AI chưa bấm "Đã rà soát"
        - `QuestionReferenced` (409): câu đang được đề tham chiếu nên không xóa được
        - `QuestionsNotApproved` (409): gửi duyệt đề khi còn câu chưa `Approved`
        - `PublishedVersionExists` (409): đề đã có phiên bản `Published` khác
        - `QuotaExceeded` (429) · `RateLimited` (429)
        - `InternalError` (500)
      enum:
        - ValidationFailed
        - Unauthorized
        - Forbidden
        - NotFound
        - Conflict
        - SelfReview
        - InvalidStateTransition
        - AiReviewRequired
        - QuestionReferenced
        - QuestionsNotApproved
        - PublishedVersionExists
        - QuotaExceeded
        - RateLimited
        - InternalError

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # ───────────── Kiểu dùng chung ─────────────
    Role:
      type: string
      enum: [teacher, head, admin]
    Grade:
      type: integer
      enum: [10, 11, 12]
    QuestionType:
      type: string
      enum: [MultipleChoice, TrueFalse, ShortAnswer, Essay]
      description: MVP bắt buộc `MultipleChoice`; model dữ liệu hỗ trợ đủ 4 dạng.
    Difficulty:
      type: string
      enum: [Recognition, Understanding, Application, HighApplication]
    QuestionStatus:
      type: string
      enum: [Draft, Submitted, Approved, Rejected, Archived]
    QuestionSource:
      type: string
      enum: [AI, Manual]
    AiVerification:
      type: string
      enum: [NotChecked, Agree, Disagree]
    ExamVersionStatus:
      type: string
      enum: [Draft, Submitted, Approved, Rejected, Published, Archived]
    AiJobStatus:
      type: string
      enum: [Queued, Running, Succeeded, Failed]
    AuditEntityType:
      type: string
      enum: [Question, Exam, ExamVersion, QuestionSet, User, AiJob, Department, Subject, Topic]

    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }

    # ───────────── Me & Catalog ─────────────
    Me:
      type: object
      required: [id, email, fullName, role, departmentId, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId:
          type: [string, 'null']
          format: uuid
          description: '`null` chỉ với Admin không thuộc tổ.'
        departmentName: { type: [string, 'null'] }
        isActive: { type: boolean }

    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    DepartmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Department' }

    Subject:
      type: object
      required: [id, name, departmentId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        departmentId: { type: string, format: uuid }
    SubjectInput:
      type: object
      required: [name, departmentId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        departmentId: { type: string, format: uuid }
    SubjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Subject' }

    Topic:
      type: object
      required: [id, subjectId, grade, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        name: { type: string }
        sortOrder: { type: integer }
    TopicInput:
      type: object
      required: [subjectId, grade, name, sortOrder]
      properties:
        subjectId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        name: { type: string, minLength: 1, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0 }
    TopicPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Topic' }

    # ───────────── Payload theo dạng câu (context 8.2) ─────────────
    MultipleChoicePayload:
      type: object
      description: Đúng 4 phương án A–D, đúng 1 đáp án đúng.
      required: [options, correctLabel]
      additionalProperties: false
      properties:
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [label, text]
            additionalProperties: false
            properties:
              label: { type: string, enum: [A, B, C, D] }
              text: { type: string, minLength: 1, maxLength: 10000 }
        correctLabel: { type: string, enum: [A, B, C, D] }
    TrueFalsePayload:
      type: object
      description: Đúng 4 ý a–d, mỗi ý có đúng/sai.
      required: [statements]
      additionalProperties: false
      properties:
        statements:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [label, text, isTrue]
            additionalProperties: false
            properties:
              label: { type: string, enum: [a, b, c, d] }
              text: { type: string, minLength: 1, maxLength: 10000 }
              isTrue: { type: boolean }
    ShortAnswerPayload:
      type: object
      description: 1–20 đáp án chấp nhận; `tolerance` chỉ cho `answerType=number`. Đáp án number là chuỗi số hữu hạn, chấp nhận dấu phẩy/chấm thập phân, không dùng phân cách hàng nghìn.
      required: [answerType, acceptedAnswers]
      additionalProperties: false
      properties:
        answerType: { type: string, enum: [number, text] }
        acceptedAnswers:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 10000 }
        unit: { type: [string, 'null'], maxLength: 10000 }
        tolerance: { type: [number, 'null'], minimum: 0 }
    EssayPayload:
      type: object
      description: Tổng điểm rubric = điểm câu (khi đưa vào đề).
      required: [modelAnswer, rubric]
      additionalProperties: false
      properties:
        modelAnswer: { type: string, maxLength: 10000 }
        rubric:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [criterion, points]
            additionalProperties: false
            properties:
              criterion: { type: string, minLength: 1, maxLength: 10000 }
              points: { type: number, exclusiveMinimum: 0 }
    QuestionPayload:
      description: |
        Cấu trúc theo `type` của câu chứa nó. Backend validate `payload` khớp `type`
        (sai → 400 `ValidationFailed` với `errors["payload"]`). Khác với `oneOf` thuần, client nên
        chọn schema theo `type`, không đoán theo hình dạng.
      oneOf:
        - $ref: '#/components/schemas/MultipleChoicePayload'
        - $ref: '#/components/schemas/TrueFalsePayload'
        - $ref: '#/components/schemas/ShortAnswerPayload'
        - $ref: '#/components/schemas/EssayPayload'

    # ───────────── Questions ─────────────
    QuestionInput:
      type: object
      additionalProperties: false
      required: [subjectId, topicId, grade, type, difficulty, stem, payload]
      properties:
        subjectId: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        stem:
          type: string
          minLength: 1
          maxLength: 10000
          description: Markdown + LaTeX. Là dữ liệu không tin cậy — frontend sanitize khi hiển thị.
        payload: { $ref: '#/components/schemas/QuestionPayload' }
        explanation:
          type: [string, 'null']
          maxLength: 10000
          description: Lời giải (Markdown + LaTeX).

    Question:
      type: object
      required:
        - id
        - subjectId
        - topicId
        - departmentId
        - grade
        - type
        - difficulty
        - stem
        - payload
        - status
        - revision
        - source
        - aiVerification
        - aiReviewedByAuthor
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        departmentId:
          type: string
          format: uuid
          description: Cố định lúc tạo; dùng cho quyền "cùng tổ".
        grade: { $ref: '#/components/schemas/Grade' }
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        stem: { type: string }
        payload: { $ref: '#/components/schemas/QuestionPayload' }
        explanation: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        revision:
          type: integer
          minimum: 1
          description: Tăng khi sửa nội dung câu `Approved`.
        source: { $ref: '#/components/schemas/QuestionSource' }
        aiJobId: { type: [string, 'null'], format: uuid }
        aiOrdinal: { type: [integer, 'null'], minimum: 1 }
        aiVerification: { $ref: '#/components/schemas/AiVerification' }
        aiVerificationNote: { type: [string, 'null'] }
        aiReviewedByAuthor:
          type: boolean
          description: Đã bấm "Đã rà soát" (chỉ có nghĩa với `source=AI`).
        createdBy: { $ref: '#/components/schemas/UserRef' }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'], description: 'Lý do từ chối (khi `Rejected`).' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QuestionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Question' }

    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, 'null'], maxLength: 2000 }
    RejectRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Lý do từ chối — bắt buộc.

    # ───────────── Question sets ─────────────
    QuestionSetInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    QuestionSet:
      type: object
      required: [id, name, itemCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        itemCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QuestionSetDetail:
      allOf:
        - $ref: '#/components/schemas/QuestionSet'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Question' }
    QuestionSetItemInput:
      type: object
      required: [questionId]
      properties:
        questionId: { type: string, format: uuid }
    QuestionSetPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuestionSet' }

    # ───────────── AI ─────────────
    AiGenerateRequest:
      type: object
      required: [subjectId, topicId, grade, type, difficulty, count]
      properties:
        subjectId: { type: string, format: uuid }
        topicId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        count:
          type: integer
          minimum: 1
          description: Số câu muốn sinh; tối đa theo `AiQuota.maxQuestionsPerJob` (vượt → 400 hoặc 429 `QuotaExceeded`).
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Ghi chú yêu cầu thêm dạng văn bản ngắn. Dữ liệu không tin cậy (prompt injection).
    AiJobParams:
      description: Tham số đã dùng để tạo job (bản sao của `AiGenerateRequest`).
      allOf:
        - $ref: '#/components/schemas/AiGenerateRequest'
    AiJob:
      type: object
      required: [id, status, params, attempt, maxAttempts, inputTokens, outputTokens, createdAt, requestedBy]
      properties:
        id: { type: string, format: uuid }
        requestedBy: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/AiJobStatus' }
        params: { $ref: '#/components/schemas/AiJobParams' }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        errorCode:
          type: [string, 'null']
          description: Mã lỗi nghiệp vụ của job (vd `InvalidModelOutput`, `ContentRefused`, `Throttled`), khi `Failed`.
        errorMessage: { type: [string, 'null'] }
        modelId: { type: [string, 'null'] }
        promptVersion: { type: [string, 'null'] }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        questionIds:
          type: array
          description: Các câu `Draft` đã sinh, theo `aiOrdinal`; rỗng nếu chưa `Succeeded`.
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    AiJobPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AiJob' }
    AiQuota:
      type: object
      required: [date, jobsLimit, jobsUsed, tokensLimit, tokensUsed, maxQuestionsPerJob, resetsAt]
      properties:
        date:
          type: string
          format: date
          description: Ngày tính quota (UTC). [GIẢ ĐỊNH]
        jobsLimit: { type: integer, minimum: 0 }
        jobsUsed: { type: integer, minimum: 0 }
        tokensLimit: { type: integer, minimum: 0 }
        tokensUsed: { type: integer, minimum: 0 }
        maxQuestionsPerJob: { type: integer, minimum: 1 }
        resetsAt: { type: string, format: date-time }

    # ───────────── Exams ─────────────
    ExamCreate:
      type: object
      required: [title, subjectId, grade]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        subjectId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
    ExamUpdate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
    Exam:
      type: object
      required: [id, title, subjectId, grade, departmentId, createdBy, latestVersionNo, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subjectId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        departmentId: { type: string, format: uuid }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        latestVersionNo: { type: integer, minimum: 1 }
        publishedVersionId:
          type: [string, 'null']
          format: uuid
          description: Phiên bản đang `Published` (tối đa một).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExamDetail:
      allOf:
        - $ref: '#/components/schemas/Exam'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              description: Tất cả phiên bản, `versionNo` giảm dần.
              items: { $ref: '#/components/schemas/ExamVersionSummary' }
    ExamPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Exam' }

    # ───────────── Exam versions ─────────────
    ExamVersionCreate:
      type: object
      properties:
        fromVersionId:
          type: [string, 'null']
          format: uuid
          description: Mặc định phiên bản mới nhất của đề.
    ExamVersionItemInput:
      type: object
      required: [sourceQuestionId, points]
      properties:
        sourceQuestionId: { type: string, format: uuid }
        points: { type: number, exclusiveMinimum: 0 }
    ExamVersionUpdate:
      type: object
      required: [durationMinutes, items]
      properties:
        durationMinutes: { type: integer, minimum: 1, maximum: 600 }
        items:
          type: array
          description: Thứ tự mảng = `sortOrder`. Không trùng `sourceQuestionId`.
          items: { $ref: '#/components/schemas/ExamVersionItemInput' }
    ExamVersionItem:
      type: object
      required: [sortOrder, points, sourceQuestionId, sourceRevision, type, difficulty, stem, payload]
      properties:
        sortOrder: { type: integer, minimum: 1 }
        points: { type: number, exclusiveMinimum: 0 }
        sourceQuestionId: { type: string, format: uuid }
        sourceRevision:
          type: integer
          description: '`revision` của câu nguồn tại thời điểm chọn (Draft) hoặc chụp snapshot (từ Submitted).'
        currentSourceRevision:
          type: [integer, 'null']
          description: |
            Chỉ có khi `Draft`/`Rejected`: `revision` hiện tại của câu nguồn; khác `sourceRevision` → cảnh báo.
            Từ `Submitted` trở đi luôn `null`.
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        stem: { type: string, description: 'Nội dung hiện tại (Draft) hoặc `stem_snapshot`.' }
        payload: { $ref: '#/components/schemas/QuestionPayload' }
        explanation: { type: [string, 'null'] }
    ExamVersionSummary:
      type: object
      required: [id, examId, examTitle, subjectId, grade, departmentId, createdBy, versionNo, status, durationMinutes, totalPoints, questionCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        subjectId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        departmentId: { type: string, format: uuid }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        versionNo:
          type: integer
          minimum: 1
          description: Trong MVP, đây cũng là mã đề.
        status: { $ref: '#/components/schemas/ExamVersionStatus' }
        durationMinutes: { type: integer, minimum: 1 }
        totalPoints: { type: number, minimum: 0 }
        questionCount: { type: integer, minimum: 0 }
        contentHash:
          type: [string, 'null']
          description: Chỉ có từ `Submitted` trở đi.
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'] }
        publishedBy:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExamVersion:
      allOf:
        - $ref: '#/components/schemas/ExamVersionSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExamVersionItem' }
            warnings:
              type: array
              description: Cảnh báo không chặn (vd câu nguồn đã đổi `revision`, hoặc câu bị loại khi tạo phiên bản mới).
              items:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  sourceQuestionId: { type: [string, 'null'], format: uuid }
    ExamVersionSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExamVersionSummary' }

    # ───────────── Export (tách riêng đề học sinh và đáp án) ─────────────
    SheetHeader:
      type: object
      required: [examTitle, subjectName, grade, versionNo, durationMinutes, totalPoints]
      properties:
        examTitle: { type: string }
        subjectName: { type: string }
        departmentName: { type: [string, 'null'] }
        grade: { $ref: '#/components/schemas/Grade' }
        versionNo:
          type: integer
          description: Mã đề (= `exam_versions.version_no` trong MVP).
        durationMinutes: { type: integer }
        totalPoints: { type: number }
    StudentMultipleChoicePayload:
      type: object
      description: Không có `correctLabel`.
      required: [options]
      additionalProperties: false
      properties:
        options:
          type: array
          items:
            type: object
            required: [label, text]
            additionalProperties: false
            properties:
              label: { type: string }
              text: { type: string }
    StudentTrueFalsePayload:
      type: object
      description: Không có `isTrue`.
      required: [statements]
      additionalProperties: false
      properties:
        statements:
          type: array
          items:
            type: object
            required: [label, text]
            additionalProperties: false
            properties:
              label: { type: string }
              text: { type: string }
    StudentShortAnswerPayload:
      type: object
      description: Không có `acceptedAnswers`/`tolerance`.
      required: [answerType]
      additionalProperties: false
      properties:
        answerType: { type: string, enum: [number, text] }
        unit: { type: [string, 'null'] }
    StudentEssayPayload:
      type: object
      description: Không có `modelAnswer`/`rubric`.
      additionalProperties: false
    StudentSheetItem:
      type: object
      required: [number, points, type, stem, payload]
      additionalProperties: false
      properties:
        number: { type: integer, minimum: 1, description: Số thứ tự câu (= `sortOrder`). }
        points: { type: number }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        payload:
          oneOf:
            - $ref: '#/components/schemas/StudentMultipleChoicePayload'
            - $ref: '#/components/schemas/StudentTrueFalsePayload'
            - $ref: '#/components/schemas/StudentShortAnswerPayload'
            - $ref: '#/components/schemas/StudentEssayPayload'
    StudentSheet:
      type: object
      description: Đề học sinh — **không có** đáp án, lời giải, mức độ, `difficulty`, hay thông tin người tạo.
      required: [header, items]
      additionalProperties: false
      properties:
        header: { $ref: '#/components/schemas/SheetHeader' }
        items:
          type: array
          items: { $ref: '#/components/schemas/StudentSheetItem' }
    AnswerKeyItem:
      type: object
      required: [number, points, type, difficulty, stem, payload]
      properties:
        number: { type: integer, minimum: 1 }
        points: { type: number }
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        stem: { type: string }
        payload: { $ref: '#/components/schemas/QuestionPayload' }
        explanation: { type: [string, 'null'] }
    AnswerKey:
      type: object
      description: Đáp án/lời giải/thang điểm cho giáo viên. Không bao giờ gộp vào file học sinh.
      required: [header, items]
      properties:
        header: { $ref: '#/components/schemas/SheetHeader' }
        items:
          type: array
          items: { $ref: '#/components/schemas/AnswerKeyItem' }

    # ───────────── Audit ─────────────
    AuditLog:
      type: object
      required: [id, actor, entityType, entityId, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        actor:
          description: Người thao tác; null cho tác vụ hệ thống, note nêu rõ tác vụ.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        entityType: { $ref: '#/components/schemas/AuditEntityType' }
        entityId: { type: string, format: uuid }
        action:
          type: string
          description: Vd `submit`, `approve`, `reject`, `publish`, `unpublish`, `archive`, `create`, `update`.
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }

    # ───────────── Admin ─────────────
    AdminUser:
      type: object
      required: [id, cognitoSub, email, fullName, role, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        cognitoSub: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: [string, 'null'], format: uuid }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminUserCreate:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        departmentId:
          type: [string, 'null']
          format: uuid
          description: Bắt buộc với `teacher`/`head`; tùy chọn với `admin`.
    AdminUserUpdate:
      type: object
      required: [email, fullName, role, isActive]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: [string, 'null'], format: uuid }
        isActive: { type: boolean }
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }
    ReconcileReport:
      type: object
      required: [checkedAt, totalUsers, mismatches]
      properties:
        checkedAt: { type: string, format: date-time }
        totalUsers: { type: integer, minimum: 0 }
        mismatches:
          type: array
          items:
            type: object
            required: [userId, email, issue]
            properties:
              userId: { type: [string, 'null'], format: uuid }
              email: { type: string }
              dbRole: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
              cognitoGroups:
                type: array
                items: { type: string }
              issue:
                type: string
                enum: [RoleMismatch, MissingInCognito, MissingInDb, DisabledMismatch]
    AiUsageRow:
      type: object
      required: [user, date, jobs, tokens, estimatedCostUsd]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        date: { type: string, format: date }
        jobs: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: number, minimum: 0 }
    AiUsagePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, totals]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AiUsageRow' }
            totals:
              type: object
              description: Tổng trên **toàn bộ** kết quả lọc (không chỉ trang hiện tại).
              required: [jobs, tokens, estimatedCostUsd]
              properties:
                jobs: { type: integer, minimum: 0 }
                tokens: { type: integer, minimum: 0 }
                estimatedCostUsd: { type: number, minimum: 0 }
